<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>애프터 무료 베타 모집 · 게시 전 미리보기</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #faf8f3;
        color: #23302b;
        font-family: system-ui, sans-serif;
        padding: 36px 24px;
      }
      main {
        max-width: 1240px;
        margin: auto;
      }
      h1 {
        font-size: clamp(24px, 4vw, 36px);
        margin: 0 0 16px;
        word-break: keep-all;
      }
      p {
        line-height: 1.7;
      }
      a {
        color: #38594f;
        text-underline-offset: 4px;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin: 24px 0;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
        gap: 24px;
      }
      figure {
        margin: 0;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 12px;
      }
      figcaption {
        margin: 10px 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>소개팅까지 일이 되지 않도록.</h1>
      <p>
        인스타 캐러셀 5장 · 1080×1350 · 게시 전 미리보기입니다.<br />아래 순서로 한 게시물에
        올리세요. 실제 업로드·발송은 하지 않았습니다.
      </p>
      <nav>
        <a href="caption.txt">인스타 캡션</a><a href="invitations.txt">지인 초대 문구 4종</a
        ><a href="after-beta-invitation.zip">PNG 5장 + 문구 다운로드</a>
      </nav>
      <div class="gallery">
        <figure>
          <a href="01-cover.png"
            ><img
              src="01-cover.png"
              width="1080"
              height="1350"
              alt="퇴근했는데 소개팅까지 일이 될 순 없으니까"
          /></a>
          <figcaption>1. 공감 · 모집 표지</figcaption>
        </figure>
        <figure>
          <a href="02-one-person.png"
            ><img src="02-one-person.png" width="1080" height="1350" alt="한 사람을 알아가는 소개"
          /></a>
          <figcaption>2. 차이 · 소개 방식</figcaption>
        </figure>
        <figure>
          <a href="03-profile.png"
            ><img
              src="03-profile.png"
              width="1080"
              height="1350"
              alt="짧은 답변을 나다운 프로필 문장으로"
          /></a>
          <figcaption>3. 경험 · 프로필 정리 예시</figcaption>
        </figure>
        <figure>
          <a href="04-planning.png"
            ><img
              src="04-planning.png"
              width="1080"
              height="1350"
              alt="소개에서 약속까지 일정 조율"
          /></a>
          <figcaption>4. 강점 · 만남 일정 조율</figcaption>
        </figure>
        <figure>
          <a href="05-invitation.png"
            ><img
              src="05-invitation.png"
              width="1080"
              height="1350"
              alt="애프터 첫 무료 베타 참여 안내"
          /></a>
          <figcaption>5. 초대 · 참여 방법과 조건</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
