<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><title>애프터 · 공유 이미지</title>
  <style>
    @import url("../public/fonts/wanted-sans/WantedSansVariable.css");
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      position: relative;
      padding: 58px 80px;
      background: #ffffff;
      color: #393b42;
      font-family: "Wanted Sans Variable", sans-serif;
    }
    .logo {
      width: 175px;
      height: 62px;
      object-fit: contain;
      object-position: left center;
    }
    h1 {
      font-size: 88px;
      line-height: 1.18;
      letter-spacing: -0.03em;
      font-weight: 750;
      margin: 45px 0 22px;
      word-break: keep-all;
    }
    p {
      font-size: 29px;
      line-height: 1.5;
      font-weight: 500;
      margin: 0;
      color: #55535d;
    }
    .symbol {
      position: absolute;
      right: 76px;
      top: 233px;
      width: 255px;
      height: 270px;
      object-fit: contain;
    }
    .domain {
      position: absolute;
      left: 82px;
      bottom: 43px;
      font-size: 22px;
      color: #55535d;
    }
  </style>
  <body>
    <img class="logo" src="after-wordmark.svg" alt="애프터" />
    <h1>소개팅에도<br />내 편이 필요해.</h1>
    <p>나를 알아가는 개인 소개 매니저</p>
    <img class="symbol" src="after-symbol.svg" alt="" /><span class="domain">aftersunset.kr</span>
  </body>
</html>
