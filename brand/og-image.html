<!doctype html>
<!--
  og:image 원본 (1200×630). 소개장(D3) 팔레트.
  다시 만들기: Chrome 헤드리스로 이 파일을 1200×630 스크린샷 → public/og-image.png
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot=public/og-image.png "file://$PWD/brand/og-image.html"
  세리프는 나눔명조 ExtraBold(SIL OFL, macOS 기본 설치)로 렌더한다. 헤드리스 Chrome 이
  file:// 에서 Google Fonts 를 적용하지 않아서, 제품의 Noto Serif KR 대신 같은 명조 계열을 쓴다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    background: #FAF6EE; color: #23302B;
    font-family: "Nanum Myeongjo", "NanumMyeongjo", "Noto Serif KR", serif;
    display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box; padding: 72px 88px;
  }
  .mark { display: flex; align-items: center; gap: 14px; font-family: -apple-system, "Pretendard", sans-serif; font-weight: 600; font-size: 40px; letter-spacing: -0.04em; }
  h1 { font-size: 84px; line-height: 1.3; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
  .quote { color: #9C3D24; }
  p { margin: 0; font-family: -apple-system, "Pretendard", sans-serif; font-size: 32px; color: #5F6A64; }
  .rule { height: 1px; background: #E3DCCF; margin: 28px 0; }
</style>
</head>
<body>
  <div class="mark">
    <svg width="44" height="44" viewBox="0 0 32 32" fill="none">
      <circle cx="13" cy="17" r="7.1" stroke="#23302B" stroke-width="4.1"/>
      <path d="M20.1 17v7" stroke="#23302B" stroke-width="4.1" stroke-linecap="round"/>
      <circle cx="25" cy="8" r="2.1" fill="#9C3D24"/>
    </svg>
    after
  </div>
  <div>
    <h1>퇴근 후,<br>한 사람과의 약속<span class="quote">.</span></h1>
    <div class="rule"></div>
    <p>회사 근처, 평일 저녁. 강남·역삼권 직장인 소개</p>
  </div>
</body>
</html>
