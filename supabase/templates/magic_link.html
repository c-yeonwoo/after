<!--
  인증 코드 메일. **가입과 재로그인이 이 한 통을 공유한다.**

  ── 왜 링크가 아니라 코드인가 ──
  이 앱의 로그인·가입 화면은 **메일로 받은 숫자 코드를 입력받는다**(login.tsx / signup.tsx).
  기본 템플릿은 {{ .ConfirmationURL }} 링크만 담고 있어서, 그대로 쓰면 화면은
  코드를 묻는데 메일에는 코드가 없다. 실제로 출시 전 검증에서 제목이
  `Your Magic Link` 인 영문 기본 메일이 나갔다.

  링크를 함께 넣지 않는다.
    · 한 통에 두 방법이 있으면 어느 쪽이 정답인지 읽는 사람이 판단해야 한다.
    · 링크는 Site URL 설정에 의존한다. 어긋나면 조용히 깨진 링크가 나간다.
      코드에는 그 의존이 없다.

  ── 왜 문구가 "로그인" 이 아니라 "인증" 인가 ──
  처음엔 로그인용·가입용 템플릿을 따로 썼다. 그런데 로컬에서 실제로 보내 보니
  **처음 오는 주소에도 이 템플릿이 나갔다.** enable_confirmations = false 라
  GoTrue 가 계정 존재 여부로 템플릿을 가르지 않는다 — confirmation 템플릿은
  이메일 확인을 켠 프로젝트에서만 쓰인다.

  그래서 이 한 통이 두 경우를 다 감당해야 한다. "로그인 화면에 입력하세요" 라고
  적으면 가입하려는 사람이 없는 화면을 찾게 되므로, 어느 쪽에서도 맞는 말로 쓴다.
  회사 메일을 쓰는 이유도 여기 적는다 — 처음 오는 사람에게 가장 필요한 설명이고,
  다시 오는 사람에게 해롭지 않다.

  ── 제목에 코드를 넣는다 ──
  휴대폰 알림만 보고도 입력할 수 있다. 잠금화면 미리보기에 코드가 보이는 것은
  대가인데, 이 코드로는 1시간 안에 한 번 쓸 수 있을 뿐이고 은행·통신사도 같은
  방식을 쓴다. 편의가 위험보다 크다고 봤다.

  스타일은 전부 인라인이다 — 많은 메일 클라이언트가 <style> 을 지운다.
  이미지·웹폰트도 쓰지 않는다. 차단되면 빈 칸이 되고, 그 자체로 스팸 신호다.
-->
<div style="margin:0;padding:24px 0;background-color:#FBF5F7;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
  <div style="max-width:440px;margin:0 auto;padding:0 20px;">

    <p style="margin:0 0 28px;font-size:15px;font-weight:700;color:#8E2A4A;letter-spacing:-0.01em;">
      이클립스
    </p>

    <p style="margin:0 0 8px;font-size:20px;font-weight:700;color:#241426;letter-spacing:-0.02em;">
      인증 코드입니다
    </p>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#6E5566;">
      아래 숫자를 화면에 입력해 주세요.
    </p>

    <div style="padding:20px;background-color:#FFFCFD;border:1px solid #EEDDE5;border-radius:14px;text-align:center;">
      <!-- letter-spacing 을 크게 준다. 숫자를 눈으로 끊어 읽어야 오타가 안 난다. -->
      <div style="font-size:32px;font-weight:700;color:#241426;letter-spacing:0.2em;font-variant-numeric:tabular-nums;">
        {{ .Token }}
      </div>
    </div>

    <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#8A7080;">
      이 코드는 <strong style="color:#6E5566;">1시간</strong> 동안, 한 번만 쓸 수 있습니다.
    </p>
    <p style="margin:12px 0 0;font-size:13px;line-height:1.7;color:#8A7080;">
      회사 이메일로 보내는 이유는 <strong style="color:#6E5566;">직장이 확인된 분들끼리만</strong>
      소개하기 때문입니다. 회사명과 이메일 주소는 상대에게 공개되지 않습니다.
    </p>
    <p style="margin:12px 0 0;font-size:13px;line-height:1.7;color:#8A7080;">
      요청하지 않으셨다면 이 메일은 무시하셔도 됩니다. 코드를 다른 사람에게 알려주지
      마세요.
    </p>

    <p style="margin:32px 0 0;padding-top:16px;border-top:1px solid #EEDDE5;font-size:12px;line-height:1.7;color:#A8919E;">
      이클립스 · 강남·역삼권 직장인 1:1 소개 서비스<br />
      이 메일은 발신 전용입니다.
    </p>

  </div>
</div>
