
<div style="margin:0;padding:24px 0;background-color:#FAF8F3;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
  <div style="max-width:440px;margin:0 auto;padding:0 20px;">

    <p style="margin:0 0 28px;font-size:15px;font-weight:700;color:#AC5147;letter-spacing:-0.01em;">
      애프터
    </p>

    <p style="margin:0 0 8px;font-size:20px;font-weight:700;color:#23302B;letter-spacing:-0.02em;">
      이메일 확인 코드입니다
    </p>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.7;color:#526B75;">
      아래 숫자를 가입 화면에 입력하시면 인증이 끝납니다.
    </p>

    <div style="padding:20px;background-color:#FFFFFF;border:1px solid #D7DED8;border-radius:14px;text-align:center;">
      <div style="font-size:32px;font-weight:700;color:#23302B;letter-spacing:0.2em;font-variant-numeric:tabular-nums;">
        {{ .Token }}
      </div>
    </div>

    <p style="margin:20px 0 0;font-size:13px;line-height:1.7;color:#526B75;">
      이 코드는 <strong style="color:#23302B;">1시간</strong> 동안, 한 번만 쓸 수 있습니다.
    </p>
    <p style="margin:12px 0 0;font-size:13px;line-height:1.7;color:#526B75;">
      계정을 안전하게 만들고 다시 로그인할 때 사용하는 이메일을 확인합니다.
      개인·회사 이메일 모두 사용할 수 있고, 주소는 상대에게 공개되지 않습니다.
    </p>
    <p style="margin:12px 0 0;font-size:13px;line-height:1.7;color:#526B75;">
      가입을 신청하지 않으셨다면 이 메일은 무시하셔도 됩니다. 코드를 다른 사람에게
      알려주지 마세요.
    </p>

    <p style="margin:32px 0 0;padding-top:16px;border-top:1px solid #D7DED8;font-size:12px;line-height:1.7;color:#526B75;">
      애프터 · 개인 소개 매니저<br />
      이 메일은 발신 전용입니다.
    </p>

  </div>
</div>
